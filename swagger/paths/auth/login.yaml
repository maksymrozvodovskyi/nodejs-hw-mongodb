tags:
  - Auth
summary: Login user
operationId: loginUser
description: Login user with email and password
security: []
requestBody:
  content:
    application/json:
      schema:
        type: object
        required:
          - email
          - password
        properties:
          email:
            description: User's email
            type: string
            example: example@mail.com
          password:
            description: User's password
            type: string
            example: qweqwezxcqwe22
responses:
  '200':
    description: User successfully logged in
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully logged in an user
            data:
              type: object
              required:
                - accesToken
              properties:
                accesToken:
                  type: string
                  example: Wad3SGuuobrYmM6o5iQtKLlxUgKIO/KZK4fdm5w-
  '400':
    $ref: ../../components/responses/400.yaml
  '401':
    $ref: ../../components/responses/401.yaml
